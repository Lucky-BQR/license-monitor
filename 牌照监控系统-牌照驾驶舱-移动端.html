<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>牌照監控駕駛艙 · 移動端 | C-SMART 投標管理平台</title>
<style>
/* ==================== 设计令牌（与UI规范一致） ==================== */
:root{
  --m-bg:#eef4fb;
  --m-surface:#ffffff;
  --m-primary:#2786d8;
  --m-primary-dark:#1a6bb8;
  --m-text:#1a2b3c;
  --m-text-2:#3d454d;
  --m-text-3:#6b7a8d;
  --m-text-muted:#9aa8b8;
  --m-line:#e3edf7;
  --m-success:#4acb83;
  --m-warn:#e8930c;
  --m-danger:#ff5b5b;
  --m-purple:#9333ea;
  --m-radius:14px;
  --m-shadow:0 2px 10px rgba(39,134,216,.08);
  --font-ui:"PingFang SC",MiSans,"Microsoft YaHei",Arial,sans-serif;
  --font-num:"D-DIN-PRO","Arial Narrow",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100%;}
body{
  background:var(--m-bg);
  color:var(--m-text);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
svg{display:block;}

/* 手机容器：桌面访问时居中显示手机宽度 */
.m-app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--m-bg);position:relative;padding-bottom:calc(20px + env(safe-area-inset-bottom));}

/* ==================== 顶部导航（参考平台移动端样式） ==================== */
.m-navbar{
  position:sticky;top:0;z-index:50;
  height:48px;display:flex;align-items:center;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--m-line);
  padding:0 8px;
}
.m-nav-back{
  width:36px;height:36px;display:grid;place-items:center;color:var(--m-text);
}
.m-nav-back svg{width:20px;height:20px;}
.m-nav-title{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:16px;font-weight:600;color:var(--m-text);white-space:nowrap;
}
.m-nav-more{
  margin-left:auto;width:36px;height:36px;display:grid;place-items:center;color:var(--m-text);
}
.m-nav-more svg{width:20px;height:20px;}

/* ==================== 蓝色波浪横幅（平台统一头部样式） ==================== */
.m-banner{
  margin:0;
  height:78px;
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#e3f0fc 0%,#cfe6fa 55%,#c2e0f9 100%);
}
.m-banner .wave{
  position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;
  pointer-events:none;
}
.m-banner-title{
  position:absolute;left:50%;top:20px;transform:translateX(-50%);
  font-size:19px;font-weight:700;color:#2f6ea8;letter-spacing:.06em;
  white-space:nowrap;z-index:2;
}
.m-banner-pill{
  position:absolute;top:26px;z-index:3;
  min-width:76px;height:34px;padding:0 10px;
  display:flex;align-items:center;justify-content:center;gap:4px;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(255,255,255,.95);
  border-radius:7px;
  color:#4e8eb9;font-size:13px;font-weight:600;
  box-shadow:0 2px 8px rgba(39,134,216,.14);
}
.m-banner-pill svg{width:12px;height:12px;}
.m-banner-pill.p-left{left:12px;}
.m-banner-pill.p-right{right:12px;}
/* 语言切换行 + 层级筛选（外置） */
.m-lang-row{
  display:flex;align-items:center;
  padding:8px 12px 0;gap:8px;
}
.m-lang{
  display:inline-flex;align-items:center;gap:5px;flex:none;
  height:28px;padding:0 12px;border-radius:7px;
  background:#fff;border:1px solid var(--m-line);
  color:var(--m-text-2);font-size:12px;font-weight:500;
  box-shadow:0 1px 3px rgba(39,134,216,.06);
}
.m-lang svg{width:11px;height:11px;color:var(--m-text-muted);}
.m-level-btn{
  margin-left:auto;flex:none;
  display:inline-flex;align-items:center;gap:5px;
  height:28px;padding:0 11px;border-radius:14px;
  background:#fff;border:1px solid rgba(39,134,216,.35);
  color:var(--m-primary-dark);font-size:11px;font-weight:600;
  box-shadow:0 1px 4px rgba(39,134,216,.1);
}
.m-level-btn svg{width:11px;height:11px;color:var(--m-primary);flex:none;}
.m-level-btn .lv-val{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.m-updatetime{
  margin:6px 14px 0;font-size:10px;color:var(--m-text-muted);
}

/* ==================== 通用卡片 ==================== */
.m-card{
  margin:10px 12px 0;
  background:var(--m-surface);border-radius:var(--m-radius);
  box-shadow:var(--m-shadow);
  overflow:hidden;
}
.m-card-head{
  display:flex;align-items:center;gap:7px;
  padding:12px 14px 10px;
  border-bottom:1px solid #f0f5fa;
}
.m-card-head .m-ico{
  width:20px;height:20px;flex:none;display:grid;place-items:center;color:var(--m-primary);
}
.m-card-head .m-ico svg{width:17px;height:17px;}
.m-card-head h2{font-size:15px;font-weight:700;color:var(--m-text);}
.m-card-head .m-hint{
  width:15px;height:15px;border-radius:50%;flex:none;
  background:#f6c244;color:#fff;font-size:10px;font-weight:700;
  display:grid;place-items:center;
}
.m-card-head .m-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.m-card-head .m-note{font-size:10px;color:var(--m-text-muted);white-space:nowrap;}
.m-card-body{padding:10px 14px 12px;}

/* ==================== KPI 2×2 ==================== */
.m-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.m-kpi{
  border-radius:10px;padding:10px 12px;
  background:linear-gradient(150deg,#f6faff,#eef5fd);
  border:1px solid #e6f0fa;
  display:flex;flex-direction:column;gap:3px;
  position:relative;overflow:hidden;
}
.m-kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.m-kpi.k-blue::before{background:var(--m-primary);}
.m-kpi.k-green::before{background:var(--m-success);}
.m-kpi.k-orange::before{background:var(--m-warn);}
.m-kpi.k-purple::before{background:var(--m-purple);}
.m-kpi-label{font-size:11px;color:var(--m-text-3);font-weight:500;display:flex;align-items:center;gap:4px;}
.m-kpi-label svg{width:13px;height:13px;}
.m-kpi.k-blue .m-kpi-label svg{color:var(--m-primary);}
.m-kpi.k-green .m-kpi-label svg{color:var(--m-success);}
.m-kpi.k-orange .m-kpi-label svg{color:var(--m-warn);}
.m-kpi.k-purple .m-kpi-label svg{color:var(--m-purple);}
.m-kpi-value{font-family:var(--font-num);font-size:26px;font-weight:700;color:var(--m-text);line-height:1.1;}
.m-kpi-value .unit{font-family:var(--font-ui);font-size:12px;color:var(--m-text-3);font-weight:400;margin-left:3px;}

/* ==================== 牌照卡 ==================== */
.m-lic-tools{display:flex;align-items:center;gap:8px;padding:10px 14px 0;}
.m-legend{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--m-text-3);}
.m-legend .lg{display:flex;align-items:center;gap:3px;}
.m-legend .dot{width:6px;height:6px;border-radius:50%;}
.m-legend .dot.ok{background:var(--m-success);}
.m-legend .dot.paused{background:var(--m-danger);}
.m-contractor{margin-left:auto;position:relative;}
.m-contractor select{
  height:28px;padding:0 22px 0 8px;max-width:170px;
  border:1px solid var(--m-line);border-radius:7px;
  background:#fff;color:var(--m-text-2);font-size:11px;font-family:var(--font-ui);
  appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%23718096' stroke-width='2.5' stroke-linecap='round' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 6px center;
}
.m-lic-list{display:flex;flex-direction:column;gap:8px;}
.m-lic{
  border-radius:10px;padding:10px 12px;
  background:linear-gradient(180deg,#fbfdff,#f5f9fe);
  border:1.5px solid #e2edf8;
  display:flex;flex-direction:column;gap:7px;
  position:relative;transition:all .18s ease;
}
.m-lic.is-selected{
  border-color:var(--m-primary);
  background:linear-gradient(180deg,#eef6ff,#e2effd);
  box-shadow:0 0 0 3px rgba(39,134,216,.13);
}
.m-lic.is-paused{border-color:rgba(255,91,91,.3);}
.m-lic.is-paused.is-selected{border-color:var(--m-primary);}
.m-lic-notify{
  position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;
  background:var(--m-danger);border:1.5px solid #fff;box-shadow:0 0 0 2px rgba(255,91,91,.2);
}
.m-lic-r1{display:flex;align-items:center;gap:6px;min-width:0;}
.m-lic-name{font-size:14px;font-weight:700;color:var(--m-text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.m-lic-group{font-size:10px;padding:1px 6px;border-radius:3px;background:rgba(39,134,216,.1);color:var(--m-primary);font-weight:600;flex:none;}
.m-lic-tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;flex:none;}
.m-lic-tag.ok{color:var(--m-success);background:rgba(74,203,131,.1);}
.m-lic-tag.paused{color:var(--m-danger);background:rgba(255,91,91,.1);}
.m-lic-r2{display:flex;align-items:center;gap:8px;}
.m-issuer{
  display:inline-flex;align-items:center;gap:3px;
  padding:1px 7px;border-radius:3px;font-size:10px;font-weight:600;flex:none;
}
.m-issuer.issuer-dev{color:#2786d8;background:rgba(39,134,216,.1);}
.m-issuer.issuer-bd{color:#9333ea;background:rgba(147,51,234,.1);}
.m-issuer.issuer-ha{color:#059669;background:rgba(5,150,105,.1);}
.m-lic-metrics{margin-left:auto;display:flex;gap:14px;}
.m-lic-metric{display:flex;align-items:baseline;gap:4px;}
.m-lic-metric .lb{font-size:10px;color:var(--m-text-3);}
.m-lic-metric .vl{font-family:var(--font-num);font-size:18px;font-weight:700;color:var(--m-text);line-height:1;}

/* ==================== 筛选结果卡 ==================== */
.m-result{
  display:none;margin:10px 12px 0;
  background:#fff;border-radius:12px;
  border:1px solid rgba(39,134,216,.3);border-left:4px solid var(--m-primary);
  box-shadow:0 4px 14px rgba(39,134,216,.12);
  padding:10px 12px;
  animation:rcIn .22s ease;
}
.m-result.is-show{display:block;}
@keyframes rcIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.m-result .rc-top{display:flex;align-items:center;gap:6px;min-width:0;}
.m-result .rc-label{font-size:10px;color:var(--m-text-3);font-weight:600;display:flex;align-items:center;gap:4px;flex:none;}
.m-result .rc-label svg{width:12px;height:12px;color:var(--m-primary);}
.m-result .rc-name{font-size:13px;font-weight:700;color:var(--m-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.m-result .rc-clear{
  margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:3px;
  font-size:10px;color:var(--m-text-3);padding:3px 8px;border-radius:6px;
  border:1px solid var(--m-line);
}
.m-result .rc-clear svg{width:10px;height:10px;}
.m-result .rc-metrics{
  margin-top:8px;display:flex;gap:0;border-radius:8px;overflow:hidden;
  background:linear-gradient(135deg,rgba(231,240,250,.7),rgba(255,255,255,.3));
  border:1px solid var(--m-line);
}
.m-result .rc-m{flex:1;padding:6px 4px;text-align:center;border-right:1px solid #eef3f9;}
.m-result .rc-m:last-child{border-right:0;}
.m-result .rc-m .lb{font-size:9px;color:var(--m-text-3);}
.m-result .rc-m .vl{font-family:var(--font-num);font-size:17px;font-weight:700;line-height:1.15;}
.m-result .rc-m .vl .u{font-family:var(--font-ui);font-size:9px;font-weight:400;color:var(--m-text-3);}
.m-result .rc-m.m1 .vl{color:var(--m-success);}
.m-result .rc-m.m2 .vl{color:var(--m-warn);}
.m-result .rc-m.m3 .vl{color:var(--m-primary);}

/* ==================== Tab 联动区 ==================== */
.m-tabs{
  display:flex;align-items:center;
  padding:10px 14px 0;gap:0;
  border-bottom:1px solid #f0f5fa;
}
.m-tab{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 4px 10px;font-size:14px;font-weight:600;color:var(--m-text-3);
  position:relative;
}
.m-tab .tb-count{
  font-family:var(--font-num);font-size:12px;font-weight:700;
  min-width:20px;height:18px;padding:0 5px;border-radius:9px;
  display:inline-grid;place-items:center;
  background:#eef3f9;color:var(--m-text-3);
}
.m-tab.is-active{color:var(--m-primary);}
.m-tab.is-active::after{
  content:'';position:absolute;left:20%;right:20%;bottom:-1px;height:3px;border-radius:2px;
  background:var(--m-primary);
}
.m-tab.t-project.is-active{color:#2a9d6f;}
.m-tab.t-project.is-active::after{background:var(--m-success);}
.m-tab.t-project.is-active .tb-count{background:rgba(74,203,131,.15);color:#2a9d6f;}
.m-tab.t-bid.is-active{color:#c97a00;}
.m-tab.t-bid.is-active::after{background:var(--m-warn);}
.m-tab.t-bid.is-active .tb-count{background:rgba(232,147,12,.15);color:#c97a00;}
.m-tab-filter{
  font-size:9px;color:var(--m-primary);background:rgba(39,134,216,.08);
  padding:1px 6px;border-radius:8px;white-space:nowrap;
}

/* Tab 内搜索 */
.m-pane-tools{padding:10px 14px 0;display:flex;align-items:center;gap:8px;}
.m-search{position:relative;flex:1;}
.m-search input{
  width:100%;height:30px;padding:0 10px 0 28px;
  border:1px solid var(--m-line);border-radius:8px;
  background:#f8fbfe;font-size:12px;font-family:var(--font-ui);color:var(--m-text);
}
.m-search input:focus{border-color:var(--m-primary);outline:none;background:#fff;}
.m-search input::placeholder{color:var(--m-text-muted);font-size:11px;}
.m-search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--m-text-muted);}

/* 联动跳转提示条（第二层） */
.m-link-hint{
  display:none;margin:8px 14px 0;padding:6px 10px;border-radius:8px;
  font-size:11px;align-items:center;gap:6px;
}
.m-link-hint.is-show{display:flex;}
.m-link-hint.h-project{background:rgba(74,203,131,.1);color:#2a9d6f;border:1px solid rgba(74,203,131,.25);}
.m-link-hint.h-bid{background:rgba(232,147,12,.1);color:#c97a00;border:1px solid rgba(232,147,12,.25);}
.m-link-hint .x{margin-left:auto;font-size:12px;opacity:.6;padding:0 2px;}

/* ==================== 项目卡片（移动端竖排） ==================== */
.m-proj{
  border-radius:10px;padding:10px 12px;margin-bottom:8px;
  background:#fbfdff;border:1.5px solid #e8f0f9;
  display:flex;flex-direction:column;gap:6px;
  transition:all .15s ease;
}
.m-proj.is-paused{background:rgba(255,91,91,.04);border-color:rgba(255,91,91,.18);}
.m-proj.is-match{border-color:var(--m-success);background:linear-gradient(90deg,rgba(74,203,131,.1),rgba(255,255,255,.4));box-shadow:0 0 0 2px rgba(74,203,131,.12);}
.m-proj.is-dim{opacity:.35;}
.m-proj-r1{display:flex;align-items:center;gap:6px;}
.m-proj-code{
  min-width:36px;height:20px;padding:0 6px;border-radius:4px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(39,134,216,.1);color:var(--m-primary);
  font-family:var(--font-num);font-size:11px;font-weight:700;letter-spacing:.03em;
}
.m-proj-name{font-size:13px;font-weight:600;color:var(--m-text-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.m-proj-status{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:500;flex:none;}
.m-proj-status.ok{color:var(--m-success);background:rgba(74,203,131,.1);}
.m-proj-status.paused{color:var(--m-danger);background:rgba(255,91,91,.1);}
.m-proj-r2{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--m-text-3);}
.m-proj-r2 .lb{color:var(--m-text-muted);}
.m-proj-r2 .vl{color:var(--m-text-2);font-weight:500;}
.m-proj-r2 .vl.num{font-family:var(--font-num);font-weight:600;}
.m-proj-r3{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.m-plic{
  display:inline-flex;align-items:center;gap:3px;
  padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500;line-height:1.5;
}
.m-plic .d{width:5px;height:5px;border-radius:50%;flex:none;}
.m-plic.lic-dev{color:#2786d8;background:rgba(39,134,216,.08);}.m-plic.lic-dev .d{background:#2786d8;}
.m-plic.lic-bd{color:#9333ea;background:rgba(147,51,234,.08);}.m-plic.lic-bd .d{background:#9333ea;}
.m-plic.lic-ha{color:#059669;background:rgba(5,150,105,.08);}.m-plic.lic-ha .d{background:#059669;}
.m-plic .n{color:inherit;}

/* ==================== 投标汇总条（移动端2×2） ==================== */
.m-bid-summary{
  display:grid;grid-template-columns:repeat(4,1fr);
  margin:10px 14px 0;border-radius:10px;overflow:hidden;
  background:linear-gradient(135deg,rgba(231,240,250,.7),rgba(255,255,255,.3));
  border:1px solid var(--m-line);
}
.m-bs{padding:7px 2px;text-align:center;border-right:1px solid #eef3f9;}
.m-bs:last-child{border-right:0;}
.m-bs .lb{font-size:9px;color:var(--m-text-3);font-weight:500;white-space:nowrap;}
.m-bs .rw{display:flex;align-items:baseline;justify-content:center;gap:4px;margin-top:2px;}
.m-bs .ct{font-family:var(--font-num);font-size:15px;font-weight:700;color:var(--m-text);line-height:1.1;}
.m-bs .ct .u{font-family:var(--font-ui);font-size:8px;color:var(--m-text-3);font-weight:400;}
.m-bs .amt{font-family:var(--font-num);font-size:10px;font-weight:600;color:var(--m-text-muted);}
.m-bs.a-total .ct{color:var(--m-primary);}
.m-bs.a-blue .ct{color:var(--m-primary);}
.m-bs.a-purple .ct{color:var(--m-purple);}
.m-bs.a-warn .ct{color:var(--m-warn);}

/* ==================== 投标列表项 ==================== */
.m-bid{
  display:flex;align-items:center;gap:8px;
  padding:10px;border-radius:10px;margin-bottom:8px;
  background:#fbfdff;border:1.5px solid #e8f0f9;
  transition:all .15s ease;
}
.m-bid.is-selected{border-color:var(--m-warn);background:linear-gradient(90deg,rgba(232,147,12,.1),rgba(255,255,255,.4));box-shadow:0 0 0 2px rgba(232,147,12,.12);}
.m-bid.is-match{border-color:var(--m-warn);background:linear-gradient(90deg,rgba(232,147,12,.1),rgba(255,255,255,.4));box-shadow:0 0 0 2px rgba(232,147,12,.12);}
.m-bid.is-dim{opacity:.35;}
.m-bid-ico{
  width:28px;height:28px;flex:none;border-radius:7px;
  display:grid;place-items:center;color:var(--m-primary);
  background:linear-gradient(145deg,#fff,#d5eaff);border:1px solid rgba(104,169,239,.25);
}
.m-bid-ico svg{width:14px;height:14px;}
.m-bid-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.m-bid-r1{display:flex;align-items:center;gap:5px;min-width:0;}
.m-bid-name{font-size:13px;font-weight:600;color:var(--m-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.m-bid-r2{display:flex;align-items:center;gap:6px;}

.m-footer{

}

.m-footer svg{width:20px;height:20px;}

/* ==================== 底部弹出 Sheet（页面切换 / 层级） ==================== */
.m-sheet-mask{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(15,35,60,.4);backdrop-filter:blur(2px);
}
.m-sheet-mask.is-open{display:block;}
.m-sheet{
  position:absolute;left:0;right:0;bottom:0;
  max-width:480px;margin:0 auto;
  background:#fff;border-radius:16px 16px 0 0;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  animation:sheetUp .24s ease;
}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:none;}}
.m-sheet-title{font-size:14px;font-weight:700;color:var(--m-text);text-align:center;margin-bottom:12px;position:relative;}
.m-sheet-close{position:absolute;right:0;top:-2px;width:26px;height:26px;display:grid;place-items:center;color:var(--m-text-muted);font-size:16px;}
.m-sheet-opt{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:12px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--m-text-2);
  border:1px solid var(--m-line);margin-bottom:8px;background:#fbfdff;
  text-align:left;
}
.m-sheet-opt.is-active{
  border-color:var(--m-primary);color:var(--m-primary);
  background:rgba(39,134,216,.06);font-weight:600;
}
.m-sheet-opt .tick{margin-left:auto;color:var(--m-primary);}
.m-sheet-opt .tick svg{width:16px;height:16px;}

/* ==================== 全屏弹窗（穿透/申请进度） ==================== */
.m-modal{

}
.m-modal.is-open{display:flex;}
.m-modal-head{

}
.m-modal-head .m-nav-back svg{width:20px;height:20px;}
.m-modal-title{
  position:absolute;left:50%;transform:translateX(-50%);

  max-width:70%;overflow:hidden;text-overflow:ellipsis;
}
.m-modal-body{flex:1;overflow-y:auto;padding:12px;max-width:480px;width:100%;margin:0 auto;}
.m-drill-item{

}
.m-drill-item .nm{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--m-text-2);}
.m-drill-item .cnt{font-family:var(--font-num);font-size:22px;font-weight:700;color:var(--m-primary);}
.m-drill-item .cnt-u{font-size:11px;color:var(--m-text-3);}
.m-drill-item svg{width:15px;height:15px;color:var(--m-text-muted);flex:none;}
.m-drill-back{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:7px;border:1px solid var(--m-line);
  font-size:11px;color:var(--m-text-3);background:#fff;margin-bottom:10px;
}
.m-drill-back svg{width:11px;height:11px;}
.m-drill-group{display:flex;align-items:center;gap:6px;margin:10px 0 6px;}
.m-drill-group .bar{width:3px;height:13px;border-radius:2px;}
.m-drill-group .tt{font-size:13px;font-weight:700;}
.m-drill-group .ct{font-size:10px;color:var(--m-text-muted);}
.m-drill-lic{
  background:#fff;border:1px solid var(--m-line);border-radius:9px;
  padding:10px 12px;margin-bottom:6px;
  display:flex;flex-direction:column;gap:6px;
}
.m-drill-lic .r1{display:flex;align-items:center;gap:6px;}
.m-drill-lic .nm{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--m-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.m-drill-lic .r2{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--m-text-3);}
.m-drill-lic .r2 b{font-family:var(--font-num);font-size:14px;color:var(--m-text);}

/* 申请进度卡片 */

.m-apply-summary .sg .d{width:7px;height:7px;border-radius:50%;}
.m-apply-card{

.m-apply-card .r1{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;}

.m-apply-card .ctr{font-size:10px;color:var(--m-text-muted);}
.m-apply-steps{display:flex;align-items:flex-start;margin-top:10px;}
.m-step{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;}
.m-step .dot{
  width:18px;height:18px;border-radius:50%;display:grid;place-items:center;

.m-step .dot.done{border:none;}

.m-step-line{flex:1;height:2px;background:var(--m-line);margin-top:8px;border-radius:1px;}

function renderLicenseDrillStep2(contractorId){
  var contractorNames = {'c1':'中國建築工程（香港）','c2':'中國海外房屋工程','c3':'中國海外土木工程','c4':'遠東建築','c5':'寶嘉建業'};
  var contractorLicenses = {
    'c1': ['l1','l2','l3','l4','l5','l6'],
    'c2': ['l1','l2','l4','l6'],
    'c3': ['l1','l3','l5'],
    'c4': ['l1','l2','l4'],
    'c5': ['l1','l3','l6']
  };
  var cname = contractorNames[contractorId] || '';
  var licIds = contractorLicenses[contractorId] || [];
  document.getElementById('drillTitle').textContent = cname;
  var groups = {};
  var issuerOrder = ['發展局','屋宇署','房委會'];
  var issuerColors = {'發展局':'var(--m-primary)','屋宇署':'var(--m-purple)','房委會':'var(--m-success)'};
  licIds.forEach(function(lid){
    var l = licenseMap[lid];
    if(!l) return;
    if(!groups[l.issuer]) groups[l.issuer] = [];
    groups[l.issuer].push(l);
  });
  var html = '';
  html += '<button class="m-drill-back" type="button" onclick="renderLicenseDrillStep1()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回承建商列表 · 共 '+licIds.length+' 張</button>';
  issuerOrder.forEach(function(issuer){
    if(!groups[issuer]) return;
    var list = groups[issuer];
    var color = issuerColors[issuer];
    html += '<div class="m-drill-group"><span class="bar" style="background:'+color+';"></span><span class="tt" style="color:'+color+';">'+issuer+'</span><span class="ct">('+list.length+'張)</span></div>';
    list.forEach(function(l){
      var statusText = l.status==='ok'?'正常':'暫停';
      var statusCls = l.status==='ok'?'ok':'paused';
      html += '<div class="m-drill-lic">';
      html += '<div class="r1"><span class="nm">'+l.name+'</span>';
      if(l.group) html += '<span class="m-lic-group">'+l.group+'</span>';
      html += '<span class="m-lic-tag '+statusCls+'">'+statusText+'</span></div>';
      html += '<div class="r2"><span>在證項目 <b>'+l.count+'</b></span><span>牌照投標 <b>'+l.bidCount+'</b></span></div>';
      html += '</div>';
    });
  });
  document.getElementById('drillBody').innerHTML = html;
}

/* 申请进度 */
function renderApplyProgress(){
  var stages = ['準備材料','已提交','面試安排中','完成申請'];
  var stageColors = {'準備材料':'#e8930c','已提交':'#2786d8','面試安排中':'#9333ea','完成申請':'#4acb83'};
  var issuerColors = {'發展局':'#2786d8','屋宇署':'#9333ea','房委會':'#059669'};
  var stageCounts = {};
  licenseApplyData.forEach(function(a){ stageCounts[a.stage]=(stageCounts[a.stage]||0)+1; });

  var html = '';
  html += '<div class="m-apply-summary">';
  html += '<span class="big">'+licenseApplyData.length+'<span class="u"> 張申請中</span></span>';
  stages.forEach(function(s){
    if(!stageCounts[s]) return;
    html += '<span class="sg"><span class="d" style="background:'+stageColors[s]+';"></span>'+s+' '+stageCounts[s]+'</span>';
  });
  html += '</div>';

  licenseApplyData.forEach(function(a){
    var cur = stages.indexOf(a.stage);
    var ic = issuerColors[a.issuer] || '#2786d8';
    html += '<div class="m-apply-card">';
    html += '<div class="r1">';
    html += '<span class="cat">'+a.category+'</span>';
    if(a.group!=='-') html += '<span class="m-lic-group">'+a.group+'</span>';
    html += '<span class="m-issuer" style="color:'+ic+';background:'+ic+'1a;">'+a.issuer+'</span>';
    html += '</div>';
    html += '<div class="ctr">'+a.contractor+'</div>';
    html += '<div class="m-apply-steps">';
    stages.forEach(function(s, idx){
      var color = stageColors[s];
      var done = idx<cur, isCur = idx===cur;
      html += '<div class="m-step">';
      if(done){
        html += '<span class="dot done" style="background:'+color+';"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>';
      } else if(isCur){
        html += '<span class="dot cur" style="background:'+color+';"><span class="in"></span></span>';
      } else {
        html += '<span class="dot"></span>';
      }
      html += '<span class="tx'+(isCur?' cur':'')+'"'+(isCur?' style="color:'+color+';"':'')+'>'+s+'</span>';
      html += '</div>';
      if(idx<stages.length-1){
        html += '<span class="m-step-line"'+(idx<cur?' style="background:'+stageColors[stages[idx]]+';"':'')+'></span>';
      }
    });
    html += '</div>';
    html += '</div>';
  });
  document.getElementById('applyBody').innerHTML = html;
}

/* ==================== 时间 ==================== */
function updateTime(){
  var now = new Date();
  var p = function(n){ return String(n).padStart(2,'0'); };
  document.getElementById('updateTime').textContent =
    '最近更新：'+now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate())+' '+p(now.getHours())+':'+p(now.getMinutes())+':'+p(now.getSeconds());
}

/* ==================== 初始化 ==================== */
renderAll();
switchTab('project');
updateTime();
setInterval(updateTime, 1000);
</script>
